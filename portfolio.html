<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #ffffff;
            background: #0f0f0f;
            line-height: 1.6;
        }

        .hero {
            padding: 80px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .controls {
            padding: 40px 30px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: #0f0f0f;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: #1a1a1a;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 400;
        }

        .filter-btn:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .filter-btn.active {
            border-color: rgba(255, 255, 255, 0.6);
            background: #ffffff;
            color: #0f0f0f;
            font-weight: 500;
        }

        .gallery {
            padding: 60px 30px;
        }

        .gallery-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }

        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
            background: #000;
        }

        .card:hover .card-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 24px;
        }

        .card-category {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .card-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-video-container {
            width: 100%;
            padding-bottom: 56.25%;
            position: relative;
            background: #000;
        }

        .modal-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-info {
            padding: 40px;
        }

        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: #ffffff;
            font-size: 14px;
            z-index: 1001;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #2a2a2a;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .modal-title {
            font-size: 32px;
            font-weight: 500;
            margin: 0 0 16px 0;
            color: #ffffff;
        }

        .modal-desc {
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
            margin: 0;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 40px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 16px;
            }

            .controls {
                padding: 20px 20px;
            }

            .gallery {
                padding: 30px 20px;
            }

            .modal-info {
                padding: 24px;
            }

            .modal-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Creative Portfolio</h1>
        <p>Showcase of videos, designs, and visual work crafted with precision and creativity.</p>
    </div>

    <div class="controls">
        <div class="controls-inner">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search works...">
            </div>
            <div class="filters" id="filterContainer"></div>
        </div>
    </div>

    <div class="gallery">
        <div class="gallery-inner">
            <div class="grid" id="gallery"></div>
            <div class="empty" id="emptyState" style="display: none;">No works found. Try adjusting your filters.</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModal()">Close</button>
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-video-container" id="modalVideoContainer"></div>
            <div class="modal-info">
                <div class="card-category" id="modalCategory"></div>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-desc" id="modalDesc"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Creative Portfolio. All rights reserved. Built with passion.</p>
    </footer>

    <script>
        // ===== EDIT DATA DI SINI: Tambah/hapus karya dengan mengedit array di bawah =====
        const works = [
            {
                id: 1,
                title: 'Cinematic Urban Exploration',
                category: 'Videography',
                thumb: 'https://images.unsplash.com/photo-1574375927708-d5b85b857323?w=500&h=400&fit=crop',
                videoId: 'dQw4w9WgXcQ',
                desc: 'A stunning visual journey through urban landscapes with cinematic cinematography.',
                year: 2024
            },
            {
                id: 2,
                title: 'Brand Identity Showcase',
                category: 'Design',
                thumb: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=500&h=400&fit=crop',
                videoId: 'dQw4w9WgXcQ',
                desc: 'Complete brand design system from concept to execution.',
                year: 2024
            },
            {
                id: 3,
                title: 'Travel Documentary Series',
                category: 'Videography',
                thumb: 'https://images.unsplash.com/photo-1533050487297-4d71bcdd2085?w=500&h=400&fit=crop',
                videoId: 'dQw4w9WgXcQ',
                desc: 'A comprehensive travel series capturing culture and landscapes.',
                year: 2024
            },
            {
                id: 4,
                title: 'Motion Graphics Reel',
                category: 'Animation',
                thumb: 'https://images.unsplash.com/photo-1536240478307-13ccc2c94e4c?w=500&h=400&fit=crop',
                videoId: 'dQw4w9WgXcQ',
                desc: 'Dynamic motion graphics and animation portfolio.',
                year: 2023
            },
            {
                id: 5,
                title: 'Product Photography',
                category: 'Photography',
                thumb: 'https://images.unsplash.com/photo-1542478519244-2e0b1ab8dd64?w=500&h=400&fit=crop',
                videoId: 'dQw4w9WgXcQ',
                desc: 'Professional product photography and styling.',
                year: 2023
            },
            {
                id: 6,
                title: 'Corporate Event Coverage',
                category: 'Videography',
                thumb: 'https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=400&fit=crop',
                videoId: 'dQw4w9WgXcQ',
                desc: 'Professional event videography and editing.',
                year: 2023
            }
        ];

        let currentFilter = 'All';
        let searchTerm = '';

        function getCategories() {
            return ['All', ...new Set(works.map(w => w.category))];
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            getCategories().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
                btn.textContent = cat;
                btn.onclick = () => filterBy(cat);
                container.appendChild(btn);
            });
        }

        function filterBy(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === category);
            });
            renderGallery();
        }

        function searchWorks(term) {
            searchTerm = term.toLowerCase();
            renderGallery();
        }

        function getFilteredWorks() {
            return works.filter(work => {
                const matchCategory = currentFilter === 'All' || work.category === currentFilter;
                const matchSearch = work.title.toLowerCase().includes(searchTerm);
                return matchCategory && matchSearch;
            });
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const filtered = getFilteredWorks();

            gallery.innerHTML = filtered.map((work, index) => `
                <div class="card" style="animation-delay: ${index * 0.05}s" onclick="openModal(${work.id})">
                    <img src="${work.thumb}" alt="${work.title}" class="card-image">
                    <div class="card-content">
                        <div class="card-category">${work.category} • ${work.year}</div>
                        <div class="card-title">${work.title}</div>
                        <div class="card-desc">${work.desc}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';
        }

        function openModal(id) {
            const work = works.find(w => w.id === id);
            document.getElementById('modalTitle').textContent = work.title;
            document.getElementById('modalCategory').textContent = work.category + ' • ' + work.year;
            document.getElementById('modalDesc').textContent = work.desc;
            document.getElementById('modalVideoContainer').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${work.videoId}" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen></iframe>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => searchWorks(e.target.value));
        document.getElementById('modal').addEventListener('click', closeModal);

        renderFilters();
        renderGallery();
    </script>

</body>
</html>
